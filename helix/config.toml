theme = "catppuccin_mocha"

[editor]
line-number = "absolute"
mouse = true
scrolloff = 8
scroll-lines = 3
cursorline = true
bufferline = "multiple"
color-modes = true
true-color = true
undercurl = true
idle-timeout = 250
completion-trigger-len = 1
completion-timeout = 5
preview-completion-insert = true
completion-replace = true
rulers = [80, 120]
popup-border = "all"
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
follow-symlinks = true
deduplicate-links = true
parents = true
git-ignore = true

[editor.indent-guides]
render = true
character = "┊"
skip-levels = 0

[editor.lsp]
display-messages = true
display-inlay-hints = true
display-signature-help-docs = true

[editor.soft-wrap]
enable = false

[editor.whitespace.render]
space = "none"
tab = "all"
newline = "none"

[editor.whitespace.characters]
tab = "→"
space = "·"
nbsp = "⍽"
newline = "⏎"

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = ["version-control"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers", "spacer", "diff"]

[keys.normal]
C-s = ":write"
C-p = "file_picker"
C-S-p = "command_palette"
C-S-f = "global_search"
C-f = "search"
C-g = "goto_line"
C-w = ":buffer-close"
C-n = ":new"
C-tab = "goto_next_buffer"
C-S-tab = "goto_previous_buffer"
C-z = "undo"
C-y = "redo"
C-a = "select_all"
C-c = "yank_to_clipboard"
C-x = "delete_selection_noyank"
"C-/" = "toggle_comments"

[keys.insert]
C-s = ":write"
C-a = "select_all"
C-z = "undo"
C-y = "redo"

[keys.select]
C-c = "yank_to_clipboard"
C-x = "delete_selection_noyank"
C-a = "select_all"
"C-/" = "toggle_comments"
