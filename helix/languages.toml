# Language configuration for the VS Code-style Helix setup.
# Helix ships the language-server definitions; the binaries must be on PATH.

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-"] }
indent = { tab-width = 2, unit = "  " }

[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
indent = { tab-width = 4, unit = "\t" }

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "jsx"
auto-format = true
formatter = { command = "prettier", args = ["--stdin-filepath", "%{buffer_name}"] }

